<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Tracker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <h1>📦 Inventory / Asset Tracker</h1>

    <section class="panel">
      <h2>Add / Update Item</h2>
      <form id="f">
        <input id="id" type="hidden" />
        <div class="form-group">
          <label>Name</label>
          <input id="name" placeholder="e.g., Laptop" required />
        </div>
        <div class="form-group">
          <label>SKU</label>
          <input id="sku" placeholder="e.g., INV-001" required />
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input id="quantity" type="number" min="0" placeholder="0" required />
        </div>
        <div class="form-group">
          <label>Min Stock</label>
          <input id="min_stock" type="number" min="0" value="0" required />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input id="location" placeholder="e.g., Shelf A" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Item</button>
          <button type="button" id="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
      <div id="msg" class="msg"></div>
    </section>

    <section class="panel">
      <h2>Items List</h2>
      <div class="search-bar">
        <input id="q" placeholder="Search by name, SKU, or location..." />
        <label class="checkbox-label">
          <input id="low" type="checkbox" />
          Low stock only
        </label>
      </div>
      <div id="table"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
